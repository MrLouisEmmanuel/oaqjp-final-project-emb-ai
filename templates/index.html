<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="../static/mywebscript.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">NLP Web Application: Emotion Detector</h1>
        <div class="mb-3">
            <textarea id="textToAnalyze" class="form-control" rows="4"
                      placeholder="Enter the text to analyze"></textarea>
        </div>
        <button class="btn btn-primary mb-4" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
        <h4>Result of Emotion Detection</h4>
        <div id="system_response" class="alert alert-secondary"></div>
    </div>
</body>
</html>
